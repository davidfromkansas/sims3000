<!doctype html><meta charset="utf-8"><base href="../../dist/"><title>Local dense city renderer benchmark</title><style>body{background:#142b30;color:#ecf7eb;font:16px system-ui;padding:20px}canvas{width:960px;height:540px;display:block}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>Dense city renderer</h1><p>A rendering fixture, not a simulation or saved city. Wait for assets before measuring.</p><button id="run" disabled>Loading artwork</button><pre id="result">Loading</pre><div><canvas id="view"></canvas></div><script type="module">
import {createCity} from './engine.js';import {CityRenderer} from './renderer.js?benchmark=geometry-1';import {visibleTileBounds} from './city-grid.js';
const c=createCity('Render fixture',false,256);for(const t of c.tiles){if(t.terrain==='water')continue;Object.assign(t,{type:['residential','commercial','industrial','road'][t.x%4],level:3,density:3,powered:true,watered:true,nature:0,airPollution:(t.x+t.y)%100,waterPollution:(t.x+t.y)%100});}
const r=new CityRenderer(document.querySelector('#view'),()=>c);r.frame=()=>{};r.running=false;r.preferences={vehicleAnimations:false,sceneryAnimations:false,pedestriansVisible:false};const run=document.querySelector('#run'),output=document.querySelector('#result');const ready=setInterval(()=>{if(r.assetReady){clearInterval(ready);run.disabled=false;run.textContent='Measure main renderer';output.textContent='Ready';r.draw();}},100);
run.onclick=()=>{const results=[];let mismatches=0;for(const rotation of [0,1,2,3])for(const zoom of [.65,1.2,2]){r.rotation=rotation;r.zoom=zoom;r.pan={x:0,y:0};r.visibleSceneCache=null;r.draw();const before=r.ctx.getImageData(0,0,r.canvas.width,r.canvas.height).data;r.draw();const after=r.ctx.getImageData(0,0,r.canvas.width,r.canvas.height).data;for(let i=0;i<before.length;i++)if(before[i]!==after[i])mismatches++;const measure=fresh=>{const samples=[];for(let i=0;i<7;i++){if(fresh)r.visibleSceneCache=null;const start=performance.now();r.draw();samples.push(performance.now()-start);}samples.sort((a,b)=>a-b);return samples[3];};const uncached=measure(true),cached=measure(false),b=visibleTileBounds(r);results.push({rotation,zoom,candidateTiles:(b.x1-b.x0+1)*(b.y1-b.y0+1),uncachedMedianMs:uncached,cachedMedianMs:cached});}output.textContent=JSON.stringify({cityTiles:c.tiles.length,viewport:[r.w,r.h],mismatchedChannels:mismatches,results,scope:'Main renderer JavaScript/canvas submission only, stationary dense fixture, assets loaded, animations disabled; seven samples per case. Not sustained FPS or simulation throughput.'},null,2);};
</script>
