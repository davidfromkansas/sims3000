<!doctype html><meta charset="utf-8"><title>Chrysler landmark review</title><style>body{background:#182832;color:#eee;font:16px system-ui}section{display:flex}canvas{width:240px;height:398px}img{width:240px;object-fit:contain}h1{font-size:22px}</style><h1>Chrysler Building · four city rotations and gallery illustration</h1><section id="views"></section><p id="result"></p><script type="module">import {drawLandmarkModel} from '../../dist/landmark-models.js';import {createCity,build,validateSave} from '../../dist/engine.js';import {serializeCity} from '../../dist/save.js';for(let r=0;r<4;r++){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=848;canvas.setAttribute('aria-label','City rotation '+r);views.append(canvas);drawLandmarkModel(canvas.getContext('2d'),'chryslerBuilding',r);}const art=new Image();art.src='../../dist/assets/chrysler-building-gallery.png';art.alt='Generated Chrysler gallery illustration';views.append(art);const city=createCity('Landmark verification',false);for(const t of city.tiles)Object.assign(t,{terrain:'land',nature:false,elevation:0});const placed=build(city,'chryslerBuilding',[{x:10,y:10}]);const restored=validateSave(JSON.parse(serializeCity(city)));result.textContent='Placement '+placed.ok+' · restored footprint '+restored.tiles.filter(t=>t.type==='chryslerBuilding').length+' tiles · save '+restored.version;</script>
