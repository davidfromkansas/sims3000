<!doctype html><meta charset="utf-8"><title>Local navigation rendering benchmark</title><style>body{background:#142b30;color:#ecf7eb;font:18px system-ui;padding:30px}canvas{border:1px solid #fff;margin:8px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>256 × 256 navigation rendering</h1><p>Local rendering fixture. This does not alter saved cities.</p><button id="run">Run benchmark</button><pre id="result">Ready</pre><canvas id="reference" width="256" height="256"></canvas><canvas id="cached" width="256" height="256"></canvas><script type="module">
import {createCity} from '../../dist/engine.js';import {CityRenderer} from '../../dist/renderer.js';import {createNavigationSurface,navigationColor} from '../../dist/navigation-map.js';import {drawNavigationPrecincts} from '../../dist/service-areas.js';import {educationLayerProfile} from '../../dist/education-layers.js';
const c=createCity('Render fixture',false,256);for(const t of c.tiles){if(t.terrain==='water')continue;t.type=['residential','commercial','industrial','road'][t.x%4];t.level=1+(t.y%3);t.waterPollution=(t.x+t.y)%100;t.landValue=(t.x*3+t.y)%100;}
const r=Object.create(CityRenderer.prototype);Object.assign(r,{getCity:()=>c,rotation:0});const a=document.querySelector('#reference'),b=document.querySelector('#cached'),ac=a.getContext('2d'),bc=b.getContext('2d'),surface=createNavigationSurface();
function original(layer){a.width=256;const scale=1,profile=educationLayerProfile(c,layer);for(const t of c.tiles){const [x,y]=r.transform(t.x,t.y);ac.fillStyle=navigationColor(t,layer,profile);ac.fillRect(x*scale,y*scale,scale,scale);}drawNavigationPrecincts(ac,c,layer,(x,y)=>r.transform(x,y),scale);}
function cached(layer){bc.clearRect(0,0,256,256);bc.drawImage(surface(r,layer,256,256),0,0);}
document.querySelector('#run').onclick=()=>{let mismatches=0,maxDelta=0,totalDelta=0;for(const rotation of [0,1,2,3])for(const layer of ['city','police','waterPollution']){r.rotation=rotation;original(layer);cached(layer);const aa=ac.getImageData(0,0,256,256).data,bb=bc.getImageData(0,0,256,256).data;for(let i=0;i<aa.length;i++)if(aa[i]!==bb[i]){mismatches++;maxDelta=Math.max(maxDelta,Math.abs(aa[i]-bb[i]));totalDelta+=Math.abs(aa[i]-bb[i]);};}r.rotation=0;original('city');cached('city');const measure=fn=>{const times=[];for(let j=0;j<5;j++){const start=performance.now();for(let i=0;i<10;i++){fn('city');(fn===original?ac:bc).getImageData(0,0,256,256);}times.push((performance.now()-start)/10);}return times.sort((x,y)=>x-y)[2];};const old=measure(original),now=measure(cached);document.querySelector('#result').textContent=JSON.stringify({referencePixel:[...ac.getImageData(90,90,1,1).data],cachedPixel:[...bc.getImageData(90,90,1,1).data],surfacePixel:[...surface(r,'city',256,256).getContext('2d').getImageData(90,90,1,1).data],tileCount:c.tiles.length,comparisons:12,mismatchedChannels:mismatches,maxDelta,meanDelta:totalDelta/(12*256*256*4),medianOriginalMs:old,medianCachedMs:now,scope:'Navigation terrain plus readback; 5 batches of 10 refreshes; no city simulation or full-frame FPS claim'},null,2);};
</script>
