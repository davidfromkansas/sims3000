<!doctype html><meta charset="utf-8"><base href="../../dist/"><title>Large power grid worker check</title><style>body{background:#142b30;color:#ecf7eb;font:18px system-ui;padding:30px}button{font:inherit;padding:12px;margin:10px}pre{white-space:pre-wrap}</style><h1>Large power grid worker check</h1><p>Synthetic 256 × 256 stress fixture. Does not read or write saved cities.</p><button id="run">Run one city month</button><button id="respond">Check interface response</button><p id="responses">0 responses</p><pre id="result">Ready</pre><script type="module">
import {createCity,recompute} from './engine.js';import {createSimulationRunner} from './simulation-runner.js';
let clicks=0;document.querySelector('#respond').onclick=()=>document.querySelector('#responses').textContent=++clicks+' responses';
document.querySelector('#run').onclick=async()=>{const run=document.querySelector('#run'),out=document.querySelector('#result');run.disabled=true;out.textContent='Preparing fixture';const c=createCity('Dense worker fixture',false,256);for(const t of c.tiles){t.terrain='land';t.nature=false;t.type=t.x%4===0||t.y%4===0?'road':(t.x%12===1&&t.y%12===1?'wind':['residential','commercial','industrial'][Math.floor(t.x/4)%3]);t.level=['residential','commercial','industrial'].includes(t.type)?3:0;t.density=3;if(t.type==='wind')t.root=t.y*c.size+t.x;}recompute(c);const runner=createSimulationRunner(),start=performance.now();out.textContent='Background month running';try{const result=await runner.advance(c);out.textContent=JSON.stringify({background:result.background,elapsedMs:performance.now()-start,tiles:result.city.tiles.length,month:result.city.month,originalMonth:c.month,responses:clicks,population:result.city.stats.population,scope:'One browser worker month on a synthetic dense fixture; not sustained FPS or balanced-city acceptance.'},null,2);}catch(error){out.textContent=error.stack;}finally{runner.close();run.disabled=false;}};
</script>
